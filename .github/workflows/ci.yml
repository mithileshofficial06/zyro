name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  test:
    name: contracts + sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - run: forge --version

      # swap-vm and aqua resolve their Solidity dependencies through npm into
      # node_modules, referenced by remappings.txt — not through forge
      # submodules. A fresh `forge build` fails with unresolved imports until
      # this runs.
      - name: Install swap-vm Solidity dependencies
        working-directory: contracts/lib/swap-vm
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check formatting
        working-directory: contracts
        run: forge fmt --check
        continue-on-error: true

      - name: Build
        working-directory: contracts
        run: forge build --sizes

      # Also regenerates contracts/test/fixtures/encoding.json.
      - name: Test contracts
        working-directory: contracts
        run: forge test -vv

      # The fixtures are the off-chain implementations' source of truth — for
      # wire-format bytes and for the kernel's arithmetic. If a change to the
      # Solidity alters them, the committed copies must be updated in the same
      # commit; otherwise the SDK and the subgraph are checked against a stale
      # expectation and the cross-language guarantee is worthless.
      - name: Fail if the committed fixtures are stale
        run: git diff --exit-code -- contracts/test/fixtures/

      - name: Test SDK
        run: npm test
