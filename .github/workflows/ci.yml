name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  test:
    name: contracts + sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - run: forge --version

      # swap-vm and aqua resolve their Solidity dependencies through npm into
      # node_modules, referenced by remappings.txt — not through forge
      # submodules. A fresh `forge build` fails with unresolved imports until
      # this runs.
      - name: Install swap-vm Solidity dependencies
        working-directory: contracts/lib/swap-vm
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check formatting
        working-directory: contracts
        run: forge fmt --check
        continue-on-error: true

      - name: Build
        working-directory: contracts
        run: forge build --sizes

      # Also regenerates contracts/test/fixtures/encoding.json.
      - name: Test contracts
        working-directory: contracts
        run: forge test -vv

      # The fixtures are the off-chain implementations' source of truth — for
      # wire-format bytes and for the kernel's arithmetic. If a change to the
      # Solidity alters them, the committed copies must be updated in the same
      # commit; otherwise the SDK and the subgraph are checked against a stale
      # expectation and the cross-language guarantee is worthless.
      - name: Fail if the committed fixtures are stale
        run: git diff --exit-code -- contracts/test/fixtures/

      - name: Test SDK
        run: npm test

  subgraph:
    name: subgraph
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install swap-vm Solidity dependencies
        working-directory: contracts/lib/swap-vm
        run: npm install --ignore-scripts --no-audit --no-fund

      # The subgraph's AssemblyScript kernel is checked against the Solidity's
      # own answers, so the fixtures have to exist before its tests run.
      - name: Regenerate kernel fixtures from the contracts
        working-directory: contracts
        run: forge test --match-path 'test/*Fixtures.t.sol'

      - name: Install subgraph dependencies
        working-directory: subgraph
        run: npm install --no-audit --no-fund

      - name: Transcribe fixtures to AssemblyScript
        working-directory: subgraph
        run: npm run fixtures

      - name: Fail if generated fixtures are stale
        run: |
          git diff --exit-code --             contracts/test/fixtures/             subgraph/tests/kernel-fixtures.ts             subgraph/tests/order-fixture.ts

      - name: Codegen
        working-directory: subgraph
        run: npm run codegen

      # Matchstick ships no Windows binary, so these cannot run on a Windows
      # dev machine without Docker. Linux CI is where they actually execute.
      - name: Unit tests (matchstick)
        working-directory: subgraph
        run: npm test

      - name: Build
        working-directory: subgraph
        run: npm run build

  substreams:
    name: substreams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The crate's build scripts pull in host-only dependencies that need
      # binutils, so it cannot be compiled on a Windows dev machine without a
      # gnu toolchain. Linux CI is the only place this is checked at all.
      - name: Install Rust with the wasm target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: substreams

      - name: Unit tests
        working-directory: substreams
        run: cargo test --lib

      - name: Build the wasm module
        working-directory: substreams
        run: cargo build --target wasm32-unknown-unknown --release

  console:
    name: console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: apps/console
        run: npm install --no-audit --no-fund

      # Builds with no SUBGRAPH_URL and no deployment record on purpose. Those
      # are states a live console has to render — an unconfigured one at first
      # run, an unreachable one when an endpoint goes down — and a build that
      # only passes when they are set would fail exactly when someone is
      # watching.
      - name: Build
        working-directory: apps/console
        run: npx next build
