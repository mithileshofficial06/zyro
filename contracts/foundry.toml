[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib", "node_modules"]

# swap-vm / aqua pin exactly 0.8.30; v4-core pins exactly 0.8.26.
# Let each source tree select its own compiler rather than forcing one.
auto_detect_solc = true
optimizer = true
via_ir = true

# These are swap-vm's own optimizer settings, copied verbatim from
# lib/swap-vm/foundry.toml. They are not a preference: under via_ir with
# default Yul settings, `TakerTraitsLib.build` fails to compile with
# "Cannot swap Variable _1 with Variable expr_12: too deep in the stack".
# swap-vm is the dominant dependency, so the project builds the way swap-vm
# builds.
optimizer_runs = 700

fs_permissions = [{ access = "read-write", path = "./" }]

[profile.default.optimizer_details]
yul = true
yulDetails = { stackAllocation = true, optimizerSteps = "dhfoDgvulfnTUtnIf[xa[r]EscLMcCTUtTOntnfDIulLculVcul Tpeul]jmul[jul] VcTOcul jmul : fDnTOcmu" }

[fuzz]
runs = 2000

[invariant]
runs = 256
depth = 32

# v4-core's Pool.sol hits a stack-too-deep Yul error under via_ir unless it is
# compiled with the very high optimizer_runs its own foundry.toml uses.
# See ZYRO_BUILD_SPEC.md §15 ("solc conflict").
[[profile.default.compilation_restrictions]]
paths = "lib/v4-core/src/**"
optimizer_runs = 44_444_444

[profile.ci]
verbosity = 3

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
