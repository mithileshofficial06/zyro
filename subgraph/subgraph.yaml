specVersion: 1.3.0
description: >-
  Zyro — inventory-aware dynamic liquidity on 1inch Aqua. Mirrors the live
  reservation price of every shipped position so a solver can route on it
  without re-implementing Avellaneda–Stoikov.
repository: https://github.com/mithileshofficial06/zyro
schema:
  file: ./schema.graphql

indexerHints:
  prune: auto

dataSources:
  # Aqua owns the position lifecycle and the authoritative per-strategy balance
  # ledger. Note that Aqua's events fire for EVERY app built on it, so each
  # handler filters on the Zyro router's address (see src/config.ts).
  - kind: ethereum/contract
    name: Aqua
    network: base-sepolia
    source:
      address: "0x12e969058658daf7b4c0ff495a2779c0a44b82ef"
      abi: Aqua
      startBlock: 46494666
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Position
        - PositionBalance
        - PendingPush
        - Protocol
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
      eventHandlers:
        # No parameter on any Aqua event is `indexed` — every field is in the
        # data blob. A signature that marked one indexed would decode garbage.
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Docked(address,address,bytes32)
          handler: handleDocked
        # Balances come from these two, and only these two. Accumulating
        # `Swapped` deltas on top of zero measures flow rather than holdings,
        # and handling both sources would double-count.
        - event: Pushed(address,address,bytes32,address,uint256)
          handler: handlePushed
        - event: Pulled(address,address,bytes32,address,uint256)
          handler: handlePulled

  # The router emits one Swapped per fill. Used for the fill series only — it
  # deliberately does not touch balances.
  - kind: ethereum/contract
    name: ZyroRouter
    network: base-sepolia
    source:
      address: "0x915900ccc5409beb4d11b2c4bd4c7f94b2648335"
      abi: ZyroRouter
      startBlock: 46494666
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Position
        - Fill
        - Protocol
      abis:
        - name: ZyroRouter
          file: ./abis/ZyroRouter.json
      eventHandlers:
        - event: Swapped(bytes32,address,address,address,address,uint256,uint256)
          handler: handleSwapped
